<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Manager Harness</title>
  <link rel="stylesheet" href="../../content.css">
</head>
<body>
  <button id="open-manager" type="button">打开会话管理器</button>
  <script>
    (() => {
      const fixtureParams = new URLSearchParams(location.search);
      const fixtureCalls = [];
      const fixtureCount = fixtureParams.has("large") ? 2142 : 18;
      const activeItems = Array.from({ length: fixtureCount }, (_, index) => ({
        id: `chat-${index + 1}`,
        title: index === 0 ? "当前正在打开的聊天" : `用于检查长标题截断和滚动布局的示例聊天 ${index + 1}`,
        create_time: 1750000000 - index * 86400,
        update_time: 1755000000 - index * 86400,
        is_automation_conversation: index === 4
      }));
      const archivedItems = activeItems.slice(0, 6).map((item) => ({ ...item, is_archived: true }));
      const scheduledTasks = [
        {
          task_id: "daily-review",
          conversation_id: "scheduled-chat-1",
          title: "每天检查研究进度",
          status: "active",
          created_at: "2026-08-01T00:00:00Z",
          updated_at: "2026-09-01T00:00:00Z"
        },
        {
          task_id: "weekly-summary",
          title: "每周生成摘要",
          status: "scheduled",
          created_at: "2026-07-01T00:00:00Z",
          updated_at: "2026-08-20T00:00:00Z"
        }
      ];
      const json = (value, status = 200) => new Response(JSON.stringify(value), {
        status,
        headers: { "content-type": "application/json" }
      });
      window.fetch = async (input, options = {}) => {
        const url = new URL(String(input), location.href);
        fixtureCalls.push(url.pathname);
        document.documentElement.dataset.fixtureCalls = fixtureCalls.join(",");
        if (url.pathname === "/api/auth/session") return json({ accessToken: "test-token" });
        if (url.pathname.startsWith("/backend-api/accounts/check/")) {
          return json({
            accounts: {
              default: { account: { account_id: "account-a", name: "默认测试账号" } },
              "account-a": { account: { account_id: "account-a", name: "默认测试账号" } },
              "account-b": { account: { account_id: "account-b", name: "第二测试账号" } }
            },
            account_ordering: ["account-a", "account-b"]
          });
        }
        if (url.pathname === "/backend-api/conversations") {
          const items = url.searchParams.get("is_archived") === "true" ? archivedItems : activeItems;
          return json({ items, total: items.length });
        }
        if (url.pathname === "/backend-api/pins") {
          return json([{ item_type: "conversation", item: activeItems[1] }]);
        }
        if (url.pathname === "/backend-api/tasks") {
          return json({ tasks: scheduledTasks });
        }
        if (url.pathname === "/backend-api/gizmos/snorlax/sidebar") {
          return json({ items: [{ id: "g-p-one" }, { id: "g-p-two" }] });
        }
        if (/^\/backend-api\/gizmos\/g-p-(one|two)\/conversations$/.test(url.pathname)) {
          const projectId = url.pathname.split("/").at(-2);
          return json({ items: [{
            id: `${projectId}-chat`,
            title: `项目聊天 ${projectId}`,
            update_time: 1740000000
          }] });
        }
        if (url.pathname.startsWith("/backend-api/conversation/")) {
          return json({ error: "Mutation disabled in visual harness" }, 500);
        }
        return json({ error: "Unexpected request" }, 404);
      };
    })();
  </script>
  <script src="../../conversation-manager-core.js"></script>
  <script src="../../conversation-index-store.js"></script>
  <script src="../../conversation-manager.js"></script>
  <script>
    const autoOpen = new URLSearchParams(location.search).has("auto");
    const initialView = new URLSearchParams(location.search).get("view");
    history.replaceState(null, "", "/c/chat-1");
    const openButton = document.getElementById("open-manager");
    openButton.addEventListener("click", () => {
      document.dispatchEvent(new CustomEvent("cgn:open-conversation-manager"));
    });
    if (autoOpen) {
      openButton.click();
      if (initialView) {
        const target = [...document.querySelectorAll(".cgn-manager-segment")]
          .find((button) => button.textContent === (initialView === "scheduled" ? "已安排" : initialView));
        target?.click();
      }
    }
  </script>
</body>
</html>
